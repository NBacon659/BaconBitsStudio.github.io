version: 2
updates:
  # Supply-chain hygiene (§14d): keep deps + pinned actions current.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      lint:
        patterns: ["stylelint*", "eslint*", "postcss-html"]
    ignore:
      # Major upgrades arrive ahead of the plugin/peer ecosystem and break the
      # strict `npm ci` CI step (e.g. astro 6, eslint 10, stylelint 17,
      # typescript 6 all fail today). Keep patch/minor (security) auto-PRs;
      # take majors deliberately as a tested upgrade task, not via auto-PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
