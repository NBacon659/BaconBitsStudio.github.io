version: 2
updates:
  # Supply-chain hygiene (§14d): keep deps + pinned actions current.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      lint:
        patterns: ["stylelint*", "eslint*", "postcss-html"]
    ignore:
      # TypeScript major bumps break @typescript-eslint/parser's peer range
      # (requires typescript <6.0.0). Re-allow once the parser supports TS 6.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
